global:
  resolve_timeout: 5m
  slack_api_url_file: /run/secrets/slack_webhook_url

route:
  receiver: slack-platform
  group_by:
    - alertname
    - service_name
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack-platform
    slack_configs:
      - send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity }}* — {{ .Annotations.description }}
          Alerte : {{ .Labels.alertname }}{{ if .Labels.service_name }} — Service : {{ .Labels.service_name }}{{ end }}
          {{ end }}
